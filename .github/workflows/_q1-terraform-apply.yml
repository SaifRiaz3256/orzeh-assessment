name: Q1 Terraform apply (reusable)

# Called by q1-terraform.yml after the plan job on main. The `environment` gate is the manual
# approval: the job waits for a required reviewer, and the environment only accepts main.
on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        type: string
        required: true

permissions:
  contents: read

jobs:
  apply:
    name: terraform apply
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC subject is repo:<owner>/<repo>:environment:<env>
    concurrency:
      group: q1-terraform-apply-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_ENV: ${{ inputs.environment }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Environment-scoped variable: only visible to jobs that passed the approval gate.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_APPLY }}
    defaults:
      run:
        working-directory: Question_1/infra
    steps:
      - name: Refuse to run outside main
        if: github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          echo "::error::Apply is only allowed from main"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Download reviewed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan-${{ inputs.environment }}
          path: Question_1/infra

      - name: terraform init
        run: terraform init -backend-config="env/${TF_ENV}.backend.hcl"

      # Applies the saved plan exactly as reviewed. Terraform takes the state lock and fails
      # if state changed since the plan was made ("Saved plan is stale").
      - name: terraform apply
        run: terraform apply -lock-timeout=5m tfplan

name: Q1 Terraform

on:
  # No paths filter on PRs: "Static checks" and "Plan" are required status checks on main,
  # and a path-filtered workflow would never report them on PRs for other questions.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "Question_1/**"
      - ".github/workflows/q1-terraform.yml"

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

# One run per ref at a time. Never cancel a run that may be applying.
concurrency:
  group: q1-terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.5"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: Question_1/infra
  # OIDC: the azurerm provider and backend exchange the GitHub token for an Entra ID token.
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff Question_1

      - name: terraform validate
        run: |
          for dir in Question_1/infra Question_1/bootstrap; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading the azurerm ruleset
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/Question_1/.tflint.hcl"
          tflint --recursive --chdir Question_1 --config "$GITHUB_WORKSPACE/Question_1/.tflint.hcl"

      # Trivy is installed from the official release and verified against a pinned SHA-256,
      # instead of using aquasecurity/trivy-action (whose tags were hijacked in a 2026 supply-chain attack).
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.75.0"
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Trivy IaC scan
        run: |
          # SARIF for the Security tab (never fails), then the gating table scan.
          trivy config --quiet --format sarif --output trivy.sarif Question_1
          trivy config --quiet --exit-code 1 --format table Question_1

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-q1

  plan:
    name: Plan (${{ matrix.environment }})
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    permissions:
      contents: read
      id-token: write # OIDC token for Azure
      pull-requests: write # sticky plan comment
    env:
      # Read-only identity: Reader on the subscription, Blob Data Reader on state.
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
      TF_ENV: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend-config="env/${TF_ENV}.backend.hcl"

      # -lock=false: the plan identity has read-only access to state. Safe because apply
      # takes the lock itself and rejects the saved plan if state changed in between.
      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -lock=false -var-file="env/${TF_ENV}.tfvars" -out=tfplan -detailed-exitcode \
            || ec=$?
          ec=${ec:-0}
          if [ "$ec" -eq 1 ]; then exit 1; fi
          echo "changes=$([ "$ec" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt

      - name: Job summary
        run: |
          {
            echo "## Terraform plan: ${TF_ENV}"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ env.WORKDIR }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const env = process.env.TF_ENV;
            const marker = `<!-- q1-terraform-plan-${env} -->`;
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes.*)$/m) || ['(see full plan)'])[0];
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated, see job summary/artifact';
            const body = `${marker}\n### Terraform plan: \`${env}\`\n**${summary}**\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>\n\n_Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      # The exact plan reviewers saw is what gets applied. Plan files can contain sensitive
      # values, so retention is short.
      - name: Upload plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan-${{ matrix.environment }}
          path: |
            ${{ env.WORKDIR }}/tfplan
            ${{ env.WORKDIR }}/plan.txt
          retention-days: 5
          if-no-files-found: error

  apply-dev:
    name: Apply (dev)
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_q1-terraform-apply.yml
    with:
      environment: dev
    permissions:
      contents: read
      id-token: write

  apply-prod:
    name: Apply (prod)
    needs: apply-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_q1-terraform-apply.yml
    with:
      environment: prod
    permissions:
      contents: read
      id-token: write

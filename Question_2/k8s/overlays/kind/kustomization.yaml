apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local test only. democr.azurecr.io is fictional, so the API image is replaced with
# hashicorp/http-echo (non-root, static binary, serves /health), listening on 8080 like the API.
# The DB_PASSWORD Secret is created by test/kind-test.sh with a random value (never committed).
resources:
  - ../../base

images:
  - name: democr.azurecr.io/auction-api
    newName: hashicorp/http-echo
    digest: sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186

patches:
  - target:
      kind: Deployment
      name: auction-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value: ["-listen=:8080", "-text=auction-api (kind stand-in)"]

# Pulls the DB password from Azure Key Vault (Secrets Store CSI driver, AKS add-on
# "azure-keyvault-secrets-provider") using Workload Identity, and syncs it into the
# Kubernetes Secret "auction-api-db" that the Deployment references.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: auction-api-kv
  namespace: auctions
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "00000000-0000-0000-0000-000000000000" # client ID of the workload identity (see README)
    keyvaultName: "kv-orzeh-prod" # fictional; the app's Key Vault
    tenantId: "00000000-0000-0000-0000-000000000000"
    objects: |
      array:
        - |
          objectName: auction-api-db-password
          objectType: secret
  secretObjects:
    - secretName: auction-api-db
      type: Opaque
      data:
        - objectName: auction-api-db-password
          key: DB_PASSWORD

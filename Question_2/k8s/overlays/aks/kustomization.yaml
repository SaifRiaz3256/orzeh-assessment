apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# AKS: secrets from Key Vault via Workload Identity + Secrets Store CSI driver.
# Prerequisites (cluster side): --enable-oidc-issuer --enable-workload-identity
# --enable-addons azure-keyvault-secrets-provider, and the ACR attached (AcrPull for kubelet).
resources:
  - ../../base
  - secretproviderclass.yaml

patches:
  - path: workload-identity.yaml

# CI pins the exact image built and scanned in the pipeline, e.g.:
#   kustomize edit set image democr.azurecr.io/auction-api=democr.azurecr.io/auction-api:1.0.0@sha256:<digest>
images:
  - name: democr.azurecr.io/auction-api
    newTag: "1.0.0"

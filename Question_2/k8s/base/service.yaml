apiVersion: v1
kind: Service
metadata:
  name: auction-api
  namespace: auctions
  labels:
    app.kubernetes.io/name: auction-api
    app.kubernetes.io/part-of: auctions
spec:
  type: ClusterIP # internal; exposed through an ingress controller, not directly
  selector:
    app.kubernetes.io/name: auction-api
  ports:
    - name: http
      port: 80
      # Named port: always follows the container's port (the original pointed at 80, the app listens on 8080).
      targetPort: http
      protocol: TCP

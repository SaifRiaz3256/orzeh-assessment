# Scales on CPU (relative to the container's CPU request). Requires metrics-server (built into AKS).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auction-api
  namespace: auctions
  labels:
    app.kubernetes.io/name: auction-api
    app.kubernetes.io/part-of: auctions
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auction-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

# Dedicated identity for the API instead of the namespace "default" service account.
# The API does not call the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auction-api
  namespace: auctions
  labels:
    app.kubernetes.io/name: auction-api
    app.kubernetes.io/part-of: auctions
automountServiceAccountToken: false

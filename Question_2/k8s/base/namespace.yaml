apiVersion: v1
kind: Namespace
metadata:
  name: auctions
  labels:
    app.kubernetes.io/part-of: auctions
    # Pod Security Admission: reject any pod in this namespace that is not "restricted"
    # (non-root, no privilege escalation, all capabilities dropped, seccomp on).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
